# Lab 2 - start from a template, do not start from a blank page.
#
# This is GitHub's own starter workflow "Python application" (github.com/actions/starter-workflows,
# MIT licence). You find it in your repo under Actions -> New workflow -> Continuous integration.
# Changes made for this repo, so it fits and is safe:
#   * actions pinned to the current major versions (checkout v7, setup-python v7)
#   * Python 3.13 (the repo needs 3.11 or newer)
#   * the job is called "build" (the starter's name); lab 4 replaces this whole file with ci.yml

name: Python application

on:                              # the starter runs on pushes to main and on pull requests into main
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all other findings as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          pytest
